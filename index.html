<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>¿Cuántos servidores necesito? · Método de Punto Fijo</title>
  <meta name="description" content="Proyecto de Análisis Numérico: asignación automática de servidores con el método de Punto Fijo. La app corre en el navegador con Python (stlite)." />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.4.0/build/stlite.css" />
  <style>
    html, body { margin: 0; background: #0b0f14; }
    #cargando {
      position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #dbe4ee; text-align: center; padding: 24px;
      background: #0b0f14; z-index: 0;
    }
    #cargando h1 { font-size: 26px; margin: 0 0 8px; }
    #cargando p { color: #8193a8; margin: 4px 0; max-width: 520px; line-height: 1.5; }
    .giro { width: 38px; height: 38px; border: 4px solid #243040; border-top-color: #3ddc97; border-radius: 50%;
            animation: g 1s linear infinite; margin-bottom: 20px; }
    @keyframes g { to { transform: rotate(360deg); } }
    
  </style>
</head>
<body>
  <div id="cargando">
    <div class="giro"></div>
    <h1>🖥️ ¿Cuántos servidores necesito?</h1>
    <p>Cargando Python en tu navegador… La primera vez tarda entre 20 y 60 segundos; las siguientes es más rápido.</p>
    <p style="font-size:13px">Funciona en Chrome, Edge y Safari.</p>
  </div>
  <div id="root"></div>
  <script type="module">
    import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.4.0/build/stlite.js";
    mount(
      {
        requirements: ["matplotlib", "pandas"],
        entrypoint: "app_simple.py",
        files: {
          "app_simple.py": { url: "./version_simple/app_simple.py" },
          "punto_fijo.py": { url: "./version_simple/punto_fijo.py" },
          ".streamlit/config.toml": { url: "./version_simple/.streamlit/config.toml" },
        },
      },
      document.getElementById("root"),
    );
    // Oculta el aviso de carga cuando la app empieza a dibujarse
    const root = document.getElementById("root");
    new MutationObserver((_, obs) => {
      if (root.querySelector("[data-testid='stApp'], .stApp")) {
        document.getElementById("cargando").remove(); obs.disconnect();
      }
    }).observe(root, { childList: true, subtree: true });
  </script>
</body>
</html>
