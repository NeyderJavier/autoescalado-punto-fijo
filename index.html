<!DOCTYPE html>
<html lang="es" translate="no" class="notranslate">
<head>
  <meta charset="UTF-8" />
  <meta name="google" content="notranslate" />
  <meta http-equiv="Content-Language" content="es" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>Integración Numérica · Trapecio, Simpson 1/3 y 3/8</title>
  <meta name="description" content="App didáctica de integración numérica: Trapecio, Simpson 1/3 y Simpson 3/8. Corre en el navegador con Python (stlite)." />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.4.0/build/stlite.css" />
  <style>
    html, body { margin: 0; background: #ffffff; }
    #cargando {
      position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #111827; text-align: center; padding: 24px;
      background: #ffffff;
    }
    #cargando h1 { font-size: 28px; margin: 0 0 8px; }
    #cargando p { color: #6b7280; margin: 4px 0; max-width: 520px; line-height: 1.5; }
    .giro { width: 38px; height: 38px; border: 4px solid #e5e7eb; border-top-color: #2563eb; border-radius: 50%;
            animation: g 1s linear infinite; margin-bottom: 20px; }
    @keyframes g { to { transform: rotate(360deg); } }
  </style>
</head>
<body translate="no" class="notranslate">
  <div id="cargando">
    <div class="giro"></div>
    <h1>∫ Integración Numérica</h1>
    <p>Trapecio · Simpson 1/3 · Simpson 3/8</p>
    <p>Cargando Python en tu navegador… La primera vez tarda entre 20 y 60 segundos.</p>
    <p style="font-size:13px">Funciona en Chrome, Edge y Safari.</p>
  </div>
  <div id="root" translate="no" class="notranslate"></div>
  <script type="module">
    import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.4.0/build/stlite.js";
    const archivos = [
      "app.py", "componentes.py", "graficas.py", "problemas.py",
      "metodos/__init__.py", "metodos/trapecio.py", "metodos/simpson_13.py", "metodos/simpson_38.py",
      "paginas/inicio.py", "paginas/modulo_trapecio.py", "paginas/modulo_simpson13.py", "paginas/modulo_simpson38.py",
      ".streamlit/config.toml",
    ];
    mount(
      {
        requirements: ["matplotlib", "pandas"],
        entrypoint: "app.py",
        files: Object.fromEntries(archivos.map((f) => [f, { url: "./" + f }])),
      },
      document.getElementById("root"),
    );
    const root = document.getElementById("root");
    new MutationObserver((_, obs) => {
      if (root.querySelector("[data-testid='stApp'], .stApp")) {
        document.getElementById("cargando").remove(); obs.disconnect();
      }
    }).observe(root, { childList: true, subtree: true });
  </script>
</body>
</html>
